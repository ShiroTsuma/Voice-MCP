name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check formatting
        shell: pwsh
        run: |
          $files = @(git ls-files '*.go')
          $unformatted = & gofmt -l @files
          if ($LASTEXITCODE -ne 0 -or $unformatted) { throw "Run gofmt on: $unformatted" }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build release archive
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: ./scripts/package-release.ps1 -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/voice-windows-x64.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
        working-directory: dist
        run: |
          # Release notes = the annotated tag message, read through the API (this job has no checkout).
          $ref = gh api "repos/$env:GH_REPO/git/ref/tags/$env:RELEASE_VERSION" | ConvertFrom-Json
          if ($ref.object.type -ne 'tag') { throw "$env:RELEASE_VERSION must be an annotated tag (git tag -a)." }
          gh api "repos/$env:GH_REPO/git/tags/$($ref.object.sha)" --jq '.message' | Set-Content -LiteralPath ../notes.md -Encoding utf8
          $releaseArgs = @('release', 'create', $env:RELEASE_VERSION, '--verify-tag', '--notes-file', '../notes.md', '--title', "voice $env:RELEASE_VERSION")
          if ($env:RELEASE_VERSION.Contains('-')) { $releaseArgs += '--prerelease' }
          $releaseArgs += @('voice-windows-x64.zip', 'SHA256SUMS')
          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed; inspect GitHub before retrying.' }

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>voice · Voices</title>
<!--
  Voice design: the voices the user made, designed from words or cloned from a recording, in
  their own groups on the left; on the right the one picked, or a new one being made. In the
  characters window's look, and with its controls, so the settings read as one app.
-->
<link rel="stylesheet" href="/settings/common.css">
<style>
  button, input, select, textarea { font: inherit; color: inherit; }

  /* ── Rows, switches, fields: as in the flyout ─────────────── */
  .opt { font: 12.5px var(--ui-small); color: var(--ink-3); margin-left: 4px; }
  .pair { display: flex; gap: 8px; align-items: center; }
  .pair input.num { width: 72px; flex: none; }
  aside .hold { display: grid; grid-template-columns: minmax(0, 1fr); row-gap: 4px; padding: 4px 0 6px; }
  aside .hold .lab + *, aside .hold .levelnote { margin-bottom: 6px; }
  aside .hold .lab { font-size: 13px; white-space: nowrap; }
  aside .hold select { width: 100%; }
  aside .hold.off { opacity: .45; pointer-events: none; }
  .levelnote { font: 12.5px/1.4 var(--ui-small); color: var(--ink-2); margin: 0; }
  .help:empty { display: none; }

  select, .btn, input.text, textarea { border-radius: 6px; border: 0; background-color: var(--field); color: var(--ink); font-size: 13.5px; outline: none; transition: background-color .12s, box-shadow .12s; }
  select, .btn, input.text { height: 32px; }
  select:hover, .btn:hover { background-color: var(--field-hi); }
  select:focus-visible, .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  input.text, textarea { width: 100%; padding: 0 10px; user-select: text; cursor: text; }
  textarea { display: block; height: 52px; min-height: 44px; padding: 8px 10px; resize: vertical; font: 13.5px/1.45 var(--ui); }
  input.text:hover, textarea:hover { background-color: var(--field-hi); }
  input.text:focus, textarea:focus { background-color: var(--field); box-shadow: inset 0 0 0 1.5px var(--ink-2); }
  ::placeholder { color: var(--ink-3); }

  /* ── The voices, in the user's groups ─────────────────────── */
  aside { width: 300px; flex: none; display: flex; flex-direction: column; border-right: 1px solid var(--rule); }
  aside header { padding: 18px 20px 6px; }
  aside h1 { margin: 0 0 2px; font: 600 20px/1.3 var(--ui-display); letter-spacing: -.01em; }
  .list { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 8px 8px; scrollbar-width: thin; scrollbar-color: var(--field-hi) transparent; }
  .grp { border-radius: 8px; padding-bottom: 2px; transition: background .12s, box-shadow .12s; }
  .grp.over { background: color-mix(in oklab, var(--ink) 6%, transparent); box-shadow: inset 0 0 0 1px var(--ink-3); }
  .ghead { display: flex; align-items: center; gap: 4px; min-height: 30px; padding: 4px 4px 2px 6px; }
  .ghead .fold { flex: 1; min-width: 0; display: flex; align-items: center; gap: 7px; padding: 2px 0; border: 0; background: none; text-align: left; color: var(--ink-2); }
  .ghead .fold::before { content: ""; flex: none; width: 5px; height: 5px; margin: 0 2px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg); transition: transform .15s; }
  .grp.shut .ghead .fold::before { transform: rotate(-45deg); }
  .ghead b { font: 600 11.5px/1.3 var(--ui-small); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ghead .n { font: 11.5px var(--ui-small); color: var(--ink-3); }
  .ghead .ico { width: 24px; height: 24px; padding: 0; border: 0; border-radius: 5px; background: none; color: var(--ink-3); display: grid; place-items: center; opacity: 0; transition: opacity .12s; }
  .ghead:hover .ico, .ghead .ico:focus-visible { opacity: 1; }
  .ghead .ico:hover { background: var(--field); color: var(--ink); }
  .ghead .ico svg { width: 12px; height: 12px; }
  .ghead input.text { height: 26px; font-size: 13px; }
  .grp.shut .items { display: none; }
  .items .hint { padding: 6px 10px 8px 28px; font: 12px var(--ui-small); color: var(--ink-3); }
  .item { display: grid; grid-template-columns: 1fr auto; column-gap: 8px; align-items: center; padding: 6px 10px 6px 28px; border-radius: 6px; cursor: pointer; transition: background .12s; }
  .item:hover { background: color-mix(in oklab, var(--ink) 5%, transparent); }
  .item.sel { background: var(--field); }
  .item[draggable="true"] { cursor: grab; }
  .item.dragging { opacity: .4; }
  .item .who { min-width: 0; }
  .item b { display: block; font: 600 13.5px/1.3 var(--ui); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item small { display: block; font: 12px/1.35 var(--ui-small); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .use { font: 11.5px var(--ui-small); color: var(--ink-3); white-space: nowrap; max-width: 90px; overflow: hidden; text-overflow: ellipsis; }
  .item.new b { color: var(--ink-2); font-weight: 400; }
  .flat .item { padding-left: 10px; }
  /* The engines' own voices, under the user's: a switch per engine and per voice. */
  .section { margin: 14px 6px 4px; padding-top: 10px; border-top: 1px solid var(--rule); font: 600 11px/1.3 var(--ui-small); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
  .ghead .switch { transform: scale(.8); margin-right: 2px; }
  .item.off b, .item.off small { color: var(--ink-3); }
  .grp.unready .items .item { opacity: .55; }
  aside footer { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 10px 12px 12px; border-top: 1px solid var(--rule); }

  /* ── The one open on the right ─────────────────────────────── */
  .empty p { margin: 0 0 14px; }
  form { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--field-hi) transparent; }
  .fields { padding: 22px 36px 14px; max-width: 720px; }
  h2 { margin: 0 0 4px; font: 600 18px/1.3 var(--ui-display); letter-spacing: -.01em; }
  input.text.name { height: 40px; padding: 0 12px; font: 600 18px var(--ui-display); letter-spacing: -.01em; }
  .facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; margin: 4px 0 6px; padding: 10px 12px; border-radius: 8px; background: color-mix(in oklab, var(--field) 45%, transparent); font-size: 13px; }
  .facts dt { color: var(--ink-2); }
  .facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .drop { display: grid; place-items: center; gap: 8px; min-height: 92px; padding: 14px; border-radius: 8px; text-align: center;
    box-shadow: inset 0 0 0 1.5px color-mix(in oklab, var(--ink) 18%, transparent); color: var(--ink-2); font-size: 13px; transition: background .12s, box-shadow .12s; }
  .drop.over { background: color-mix(in oklab, var(--ink) 6%, transparent); box-shadow: inset 0 0 0 1.5px var(--ink-2); }
  .drop b { color: var(--ink); font-weight: 600; }
  .row.col > select { flex: none; } /* in a column, flex: 1 would squash it */
  .btn.primary:disabled { background: transparent; color: var(--ink-3); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--ink) 14%, transparent); }
  .seg button:disabled { opacity: .4; cursor: not-allowed; }
  .seg button:disabled:hover { background: none; color: var(--ink-2); }
  .bar { flex: none; display: flex; align-items: center; gap: 8px; padding: 10px 36px; border-top: 1px solid var(--rule); }
  .bar .grow { flex: 1; }
  #status, #mstatus { min-width: 0; font: 12.5px var(--ui-small); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-right: 6px; }
  #status.warn, #mstatus.warn { color: var(--ink); }
  .btn.busy { position: relative; color: transparent !important; }
  .btn.busy::after { content: ""; position: absolute; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ground); border-right-color: transparent; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 720px) {
    aside { width: 250px; }
    .fields { padding: 18px 24px 14px; }
    .bar { padding: 10px 24px; }
  }
</style>
</head>
<body>
<aside>
  <header>
    <h1>Voices</h1>
    <p class="help">Yours in your groups, then each engine's<span class="tip" tabindex="0" data-tip="Every voice here can be a character's voice or the default voice.
- **Yours**: made from a recording or a description, in your own groups. Drag one onto a group to move it.
- **Engines**: the voices each engine brings. Switch off an engine or a voice to leave it out of the voice pickers.

Folded groups stay folded. Agents see the same voices (voice_clone, list_voices).">i</span></p>
  </header>
  <div class="list" id="list"></div>
  <footer>
    <button class="btn" id="add" type="button"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 1.5v9M1.5 6h9"/></svg>New voice</button>
    <button class="btn" id="addGroup" type="button" title="A new group, to drag voices into">New group</button>
  </footer>
</aside>
<main>
  <div class="empty" id="empty"><p>Pick a voice on the left, or make a new one.</p></div>

  <!-- A voice: its name, words about it, group, and what it is. -->
  <form id="voice" hidden autocomplete="off">
    <div class="scroll"><div class="fields">
      <div class="row col">
        <label class="lab" for="vName">Name<span class="tip" tabindex="0" data-tip="The voice's name, also its preset name.
Lowercase letters, digits, - or _.

Renaming it moves the characters, the default voice and the tunings that use it along.">i</span></label>
        <input class="text name" type="text" id="vName" maxlength="40" spellcheck="false">
      </div>
      <div class="row col">
        <label class="lab" for="vDesc">Description<span class="opt">optional</span><span class="help">What it is, or what it is for</span></label>
        <textarea id="vDesc" maxlength="600"></textarea>
      </div>
      <div class="row col">
        <label class="lab" for="vGroup">Group</label>
        <select id="vGroup"></select>
      </div>
      <div class="row col">
        <label class="lab" for="vSample">Hear it<span class="opt">optional text</span></label>
        <div class="pair"><input class="text" type="text" id="vSample" maxlength="300" placeholder="Hi, this is how I sound now."><button class="btn" id="vHear" type="button"><svg viewBox="0 0 12 12" fill="currentColor"><path d="M3 1.5v9l7.5-4.5z"/></svg>Hear it</button></div>
      </div>
      <dl class="facts" id="vFacts"></dl>
    </div></div>
    <div class="bar">
      <button class="btn" id="vDel" type="button">Delete</button>
      <span class="grow"></span><span id="status"></span>
      <button class="btn primary" id="vSave" type="submit">Save</button>
    </div>
  </form>

  <!-- An engine's own voice: what it is, whether the pickers offer it, and how it sounds. -->
  <form id="ev" hidden autocomplete="off">
    <div class="scroll"><div class="fields">
      <h2 id="evName"></h2>
      <p class="help" id="evAbout"></p>
      <div class="row">
        <label class="lab" for="evOn">In the voice pickers<span class="help">For characters and the default voice</span></label>
        <label class="switch"><input type="checkbox" id="evOn"><span></span></label>
      </div>
      <div class="row col">
        <label class="lab" for="evSample">Hear it<span class="opt">optional text</span></label>
        <div class="pair"><input class="text" type="text" id="evSample" maxlength="300" placeholder="Hi, this is how I sound."><button class="btn" id="evHear" type="button"><svg viewBox="0 0 12 12" fill="currentColor"><path d="M3 1.5v9l7.5-4.5z"/></svg>Hear it</button></div>
      </div>
      <dl class="facts" id="evFacts"></dl>
    </div></div>
    <div class="bar"><span class="grow"></span><span id="evStatus"></span></div>
  </form>

  <!-- A new voice: from words, from the microphone, or from a sound file. -->
  <form id="make" hidden autocomplete="off">
    <div class="scroll"><div class="fields">
      <h2>New voice</h2>
      <div class="row">
        <div class="lab">Make it from<span class="help" id="mFromHelp"></span></div>
        <div class="seg" id="mFrom" role="group" aria-label="Make it from"><button type="button" data-v="design">Description</button><button type="button" data-v="record">Microphone</button><button type="button" data-v="file">Sound file</button></div>
      </div>
      <div class="row col">
        <label class="lab" for="mName">Name<span class="help">Lowercase letters, digits, - or _</span></label>
        <input class="text" type="text" id="mName" maxlength="40" spellcheck="false" placeholder="e.g. narrator-warm">
      </div>
      <div class="row col">
        <label class="lab" for="mDesc" id="mDescLab"></label>
        <textarea id="mDesc" maxlength="600"></textarea>
      </div>
      <div class="row col" data-for="design">
        <label class="lab" for="mSample">Sample<span class="opt">optional</span><span class="tip" tabindex="0" data-tip="What the new voice reads once, about ten seconds.

The voice keeps the **tone** of this reading, so write it the way the voice should sound: calm, excited, sarcastic.

Empty: a neutral greeting.">i</span></label>
        <input class="text" type="text" id="mSample" maxlength="400" placeholder="A few sentences in the voice's own mood">
      </div>
      <div class="row col" data-for="file">
        <div class="lab">Recording<span class="tip" tabindex="0" data-tip="The recording the voice is cloned from.
- 5 to 15 seconds of one clear speaker, no music.
- WAV, MP3, FLAC, OGG or M4A.
- Longer clips are cut.

What it says is written down by speech recognition when the engine needs it.">i</span></div>
        <div class="drop" id="mDrop"><span id="mDropText">Drop a sound file here</span><button class="btn" id="mPick" type="button">Choose a file…</button></div>
        <input type="file" id="mFile" accept="audio/*,.wav,.mp3,.flac,.ogg,.m4a" hidden>
      </div>
      <div class="row" data-for="record">
        <div class="lab">Length<span class="help">Read a few natural sentences after the ticks</span></div>
        <div class="seg" id="mSecs" role="group" aria-label="Recording length"><button type="button" data-v="8">8 s</button><button type="button" data-v="12">12 s</button><button type="button" data-v="20">20 s</button></div>
      </div>
      <div class="row col">
        <label class="lab" for="mGroup">Group</label>
        <select id="mGroup"></select>
      </div>
      <div class="row col">
        <label class="lab" for="mEngine">Speaks with<span class="tip" tabindex="0" id="mEngineTip">i</span><span class="help" id="mEngineHelp"></span></label>
        <select id="mEngine"></select>
      </div>
      <div class="row" data-for="record file">
        <label class="lab" for="mRights">I may use this voice<span class="help">My own, or with the speaker's consent</span></label>
        <label class="switch"><input type="checkbox" id="mRights"><span></span></label>
      </div>
    </div></div>
    <div class="bar">
      <button class="btn" id="mCancel" type="button">Cancel</button>
      <span class="grow"></span><span id="mstatus"></span>
      <button class="btn primary" id="mGo" type="submit"></button>
    </div>
  </form>
</main>
<script src="/settings/common.js"></script>
<script>
const $ = id => document.getElementById(id);
const say = (id, text, warn) => { const s = $(id); s.textContent = text || ''; s.title = text || ''; s.classList.toggle('warn', !!warn); };
const seg = (id, v) => $(id).querySelectorAll('button').forEach(b => { const on = b.dataset.v === String(v); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
const segValue = id => ($(id).querySelector('button.on') || {}).dataset?.v;
const andList = a => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];
const validName = n => /^[a-z0-9][a-z0-9_-]{0,39}$/.test(n);
// A name as typed, made into one a voice can have: "Narrator Warm" → "narrator-warm".
const tidyName = s => s.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9_-]/g, '').slice(0, 40);

let state = null, voices = [], groups = [], open = null, dragVoice = '', busy = false, pendingFile = null;
const shutKey = 'voice.voiceGroupsShut';
const shut = new Set((() => { try { return JSON.parse(localStorage.getItem(shutKey) || '[]'); } catch (e) { return []; } })());
const saveShut = () => { try { localStorage.setItem(shutKey, JSON.stringify([...shut])); } catch (e) {} };

// ── Loading ─────────────────────────────────────────────────
// keep: the voice to show afterwards, "+new" for the new-voice form, null for none.
async function load(keep) {
  const [s, l] = await Promise.all([api('state'), api('clone', { action: 'list' })]);
  state = s;
  const cols = l.columns || [];
  voices = (l.rows || []).map(row => Object.fromEntries(cols.map((c, i) => [c, row[i]])));
  groups = l.groups || [];
  fillGroups($('vGroup')); fillGroups($('mGroup')); fillEngines(); fromChanged();
  if (keep === '+new') showMake();
  else if (keep && keep.includes('/') && findEngineVoice(keep).length) showEngineVoice(keep);
  else if (keep && voices.some(v => v.name === keep)) showVoice(keep);
  else showNothing();
}
window.onShow = () => { if (!busy) load(open).catch(e => say('status', e.message, true)); };

// Who speaks with each voice: characters whose voice it is (or a tuning of it), and the default voice.
function users() {
  const presets = (state && state.options && state.options.presets) || [];
  const base = name => { for (let i = 0; i < 5; i++) { const p = presets.find(x => x.name === name); if (!p || !p.extends) break; name = p.extends; } return name; };
  const out = {};
  const add = (v, who) => { if (v) (out[v] = out[v] || []).push(who); };
  for (const ch of (state && state.characters) || []) add(ch.preset && base(ch.preset), ch.name);
  if (state && state.default_preset) add(base(state.default_preset), 'default voice');
  return out;
}
const engines = () => (state && state.options && state.options.clone_engines) || [];
const engineLabel = n => (engines().find(e => e.name === n) || {}).label || n;
// Where an engine loads: Chatterbox Nano on the processor, the other sidecar engines on the graphics card.
const engineWhere = n => (engines().find(e => e.name === n) || {}).cpu ? 'on the processor' : 'on the graphics card';
const design = () => (state && state.options && state.options.voice_design) || { ready: false, runs: true, needs: 'Qwen3-TTS' };
// Why Description is off here: a card it does not run on, or the model not installed yet.
const designWhy = () => { const d = design(); return d.runs === false ? 'needs ' + d.card + ' (' + d.needs + ')' : 'needs ' + d.needs + ', in Integrations'; };

// ── The list ────────────────────────────────────────────────
function list() {
  const box = $('list'); box.textContent = '';
  const who = users();
  const item = v => {
    const it = document.createElement('div'); it.className = 'item' + (v.name === open ? ' sel' : '');
    it.innerHTML = '<div class="who"><b></b><small></small></div><span class="use"></span>';
    it.querySelector('b').textContent = v.name;
    const about = v.description || v.designed_from || '';
    it.querySelector('small').textContent = about || engineLabel(v.engine) + (v.seconds ? ', ' + Math.round(v.seconds) + ' s' : '');
    it.querySelector('.use').textContent = (who[v.name] || []).join(', ');
    it.title = (about ? about + '\n\n' : '') + (groups.length ? 'Drag onto a group to move it.' : '');
    it.addEventListener('click', () => showVoice(v.name));
    it.draggable = true;
    it.addEventListener('dragstart', e => { dragVoice = v.name; it.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', v.name); });
    it.addEventListener('dragend', () => { dragVoice = ''; box.querySelectorAll('.dragging, .over').forEach(x => x.classList.remove('dragging', 'over')); });
    return it;
  };
  if (open === '+new') {
    const it = document.createElement('div'); it.className = 'item new sel';
    it.innerHTML = '<div class="who"><b>New voice</b></div>';
    box.append(it);
  }
  if (!groups.length) { // no groups yet: a plain list
    const flat = document.createElement('div'); flat.className = 'flat';
    voices.forEach(v => flat.append(item(v)));
    if (!voices.length && open !== '+new') { const h = document.createElement('div'); h.className = 'empty'; h.textContent = 'No voices yet.'; flat.append(h); }
    box.append(flat);
    engineSections(box, who);
    return;
  }
  const lower = s => (s || '').toLowerCase();
  const section = (g, members) => {
    const sec = document.createElement('div'); sec.className = 'grp' + (shut.has(g) ? ' shut' : '');
    const hd = document.createElement('div'); hd.className = 'ghead';
    const fold = document.createElement('button'); fold.type = 'button'; fold.className = 'fold';
    fold.innerHTML = '<b></b><span class="n"></span>';
    fold.querySelector('b').textContent = g || 'No group';
    fold.querySelector('.n').textContent = members.length;
    fold.setAttribute('aria-expanded', String(!shut.has(g)));
    fold.addEventListener('click', () => {
      const s = sec.classList.toggle('shut'); s ? shut.add(g) : shut.delete(g); saveShut();
      fold.setAttribute('aria-expanded', String(!s));
    });
    hd.append(fold);
    if (g) {
      const ico = (label, path, fn) => {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'ico'; b.title = label; b.setAttribute('aria-label', label);
        b.innerHTML = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="' + path + '"/></svg>';
        b.addEventListener('click', fn); hd.append(b);
      };
      ico('Rename the group ' + g, 'M8 1.8l2.2 2.2L4.3 9.9 1.8 10.2l.3-2.5z', () => renameGroup(hd, g));
      ico('Remove the group ' + g, 'M2.5 2.5l7 7M9.5 2.5l-7 7', async () => {
        if (!(await askYes('Remove the group ' + g + '? Its voices stay, in No group.', 'Remove'))) return;
        try { await api('clone', { action: 'remove_group', group: g }); await load(open); } catch (e) { tell(e.message); }
      });
    }
    const items = document.createElement('div'); items.className = 'items';
    members.forEach(v => items.append(item(v)));
    if (!members.length) { const h = document.createElement('div'); h.className = 'hint'; h.textContent = g ? 'Drag voices here' : 'Every voice is in a group'; items.append(h); }
    sec.append(hd, items);
    sec.addEventListener('dragover', e => {
      if (!dragVoice) return;
      e.preventDefault(); e.dataTransfer.dropEffect = 'move';
      box.querySelectorAll('.grp.over').forEach(x => x !== sec && x.classList.remove('over'));
      sec.classList.add('over');
    });
    sec.addEventListener('dragleave', e => { if (!sec.contains(e.relatedTarget)) sec.classList.remove('over'); });
    sec.addEventListener('drop', async e => {
      if (!dragVoice) return;
      e.preventDefault(); sec.classList.remove('over');
      const v = voices.find(x => x.name === dragVoice);
      if (!v || lower(v.group) === lower(g)) return;
      try { await api('clone', { action: 'group', name: v.name, group: g }); await load(open); } catch (err) { tell(err.message); }
    });
    return sec;
  };
  for (const g of groups) box.append(section(g, voices.filter(v => lower(v.group) === lower(g))));
  box.append(section('', voices.filter(v => !v.group)));
  engineSections(box, who);
}

// ── The engines' own voices ─────────────────────────────────
// Their switches keep a list of what is off (voices_off): a voice's id
// (kokoro/af_bella) or a whole engine (kokoro/*). New voices are on.
const catalog = () => (state && state.options && state.options.voices) || [];
const offList = () => (state && state.voices_off) || [];
const langText = l => l ? langWord(l.split('-')[0]) + (l === 'en-us' ? ' (US)' : l === 'en-gb' ? ' (UK)' : '') : 'Many languages';
async function saveOff(off) {
  try {
    const r = await api('save', { voices_off: off, voices_rev: state.voices_rev });
    state = r.state || state;
  } catch (e) { tell(e.message); await load(open).catch(() => {}); return; }
  list(); if (open && open.includes('/')) showEngineVoice(open);
}
// The group's switch: off adds engine/* for each of its engines; on clears them and its voices' own entries.
function setGroup(g, on) {
  const ids = new Set(g.voices.map(v => v.id.toLowerCase())), stars = new Set(g.engines.map(e => (e + '/*').toLowerCase()));
  let off = offList().filter(x => !stars.has(x.toLowerCase()) && !ids.has(x.toLowerCase()));
  if (!on) off = off.concat(g.engines.map(e => e + '/*'));
  saveOff(off);
}
// A voice's switch; on inside an engine that is off turns the engine back on, its other voices staying off.
function setVoice(g, v, on) {
  const stars = new Set(g.engines.map(e => (e + '/*').toLowerCase()));
  let off = offList().filter(x => x.toLowerCase() !== v.id.toLowerCase());
  if (on && off.some(x => stars.has(x.toLowerCase()))) {
    off = off.filter(x => !stars.has(x.toLowerCase())).concat(g.voices.filter(o => o.id !== v.id).map(o => o.id));
  }
  if (!on) off.push(v.id);
  saveOff([...new Set(off)]);
}
function switchEl(on, label, fn, disabled) {
  const s = document.createElement('label'); s.className = 'switch'; s.title = label;
  const i = document.createElement('input'); i.type = 'checkbox'; i.checked = on; i.disabled = !!disabled; i.setAttribute('aria-label', label);
  i.addEventListener('click', e => e.stopPropagation());
  i.addEventListener('change', () => fn(i.checked));
  s.append(i, document.createElement('span'));
  s.addEventListener('click', e => e.stopPropagation());
  return s;
}
function engineSections(box, who) {
  const cat = catalog();
  if (!cat.length) return;
  const head = document.createElement('div'); head.className = 'section'; head.textContent = 'Engines'; box.append(head);
  for (const g of cat) {
    const key = 'engine:' + g.key, anyOn = g.voices.some(v => v.on);
    const sec = document.createElement('div'); sec.className = 'grp' + (shut.has(key) ? ' shut' : '') + (g.ready ? '' : ' unready');
    const hd = document.createElement('div'); hd.className = 'ghead';
    const fold = document.createElement('button'); fold.type = 'button'; fold.className = 'fold';
    fold.innerHTML = '<b></b><span class="n"></span>';
    fold.querySelector('b').textContent = g.title;
    fold.querySelector('.n').textContent = g.voices.filter(v => v.on).length + ' / ' + g.voices.length;
    fold.title = g.ready ? g.about : g.needs;
    fold.setAttribute('aria-expanded', String(!shut.has(key)));
    fold.addEventListener('click', () => { const s = sec.classList.toggle('shut'); s ? shut.add(key) : shut.delete(key); saveShut(); fold.setAttribute('aria-expanded', String(!s)); });
    hd.append(fold, switchEl(anyOn, (anyOn ? 'Leave out ' : 'Offer ') + g.title + ' in the voice pickers', on => setGroup(g, on)));
    const items = document.createElement('div'); items.className = 'items';
    if (!g.ready) { const h = document.createElement('div'); h.className = 'hint'; h.textContent = g.needs; items.append(h); }
    for (const v of g.voices) {
      const it = document.createElement('div'); it.className = 'item' + (v.id === open ? ' sel' : '') + (v.on ? '' : ' off');
      it.innerHTML = '<div class="who"><b></b><small></small></div><span class="use"></span>';
      it.querySelector('b').textContent = v.name;
      it.querySelector('small').textContent = [v.lang ? langText(v.lang) : '', v.gender].filter(Boolean).join(' · ') || g.title;
      it.querySelector('.use').textContent = (who[v.id] || []).join(', ');
      it.addEventListener('click', () => showEngineVoice(v.id));
      items.append(it);
    }
    sec.append(hd, items);
    box.append(sec);
  }
}
function findEngineVoice(id) {
  for (const g of catalog()) { const v = g.voices.find(x => x.id === id); if (v) return [g, v]; }
  return [];
}
function showEngineVoice(id) {
  const [g, v] = findEngineVoice(id); if (!v) return showNothing();
  if (open !== id) say('evStatus', '');
  open = id;
  $('empty').hidden = true; $('voice').hidden = true; $('make').hidden = true; $('ev').hidden = false;
  $('evName').textContent = v.name;
  $('evAbout').textContent = g.title + (g.ready ? '' : ' · ' + g.needs);
  $('evOn').checked = v.on;
  $('evOn').onchange = () => setVoice(g, v, $('evOn').checked);
  $('evHear').disabled = !g.ready; $('evHear').title = g.ready ? '' : g.needs;
  const who = users()[v.id] || [];
  const facts = [
    ['Engine', g.title],
    ['Language', v.lang ? langText(v.lang) : 'The one each sentence asks for'],
    v.gender ? ['Voice', v.gender] : null,
    ['Used by', who.length ? andList(who) + (v.on ? '' : '; it keeps speaking for them while off') : 'nobody yet; pick it for a character in Characters'],
    ['Id', v.id],
  ].filter(Boolean);
  const dl = $('evFacts'); dl.textContent = '';
  for (const [k, t] of facts) { const dt = document.createElement('dt'); dt.textContent = k; const dd = document.createElement('dd'); dd.textContent = t; dl.append(dt, dd); }
  list();
}
$('evHear').addEventListener('click', async () => {
  const [, v] = findEngineVoice(open); if (!v) return;
  say('evStatus', 'Playing ' + v.name + '…');
  try { await api('test', { Preset: v.id, Text: $('evSample').value.trim() || 'Hi, this is ' + v.name + '. This is how I sound.' }); say('evStatus', ''); }
  catch (e) { say('evStatus', e.message, true); }
});

// A group's title as a field: Enter or leaving it renames, Escape keeps the name.
function renameGroup(hd, g) {
  const fold = hd.querySelector('.fold');
  if (hd.querySelector('input')) return;
  const input = document.createElement('input'); input.className = 'text'; input.maxLength = 40; input.value = g;
  input.setAttribute('aria-label', 'Name of the group ' + g);
  fold.hidden = true; hd.querySelectorAll('.ico').forEach(b => b.hidden = true);
  hd.prepend(input); input.focus(); input.select();
  let done = false;
  const finish = async keep => {
    if (done) return; done = true;
    const to = input.value.trim();
    if (keep || !to || to === g) { input.remove(); fold.hidden = false; hd.querySelectorAll('.ico').forEach(b => b.hidden = false); return; }
    if (shut.delete(g)) { shut.add(to); saveShut(); }
    try { await api('clone', { action: 'rename_group', group: g, new_group: to }); } catch (e) { tell(e.message); }
    await load(open);
  };
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); finish(false); } else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); finish(true); } });
  input.addEventListener('blur', () => finish(false));
}
$('addGroup').addEventListener('click', async () => {
  let name = 'New group', n = 2;
  while (groups.some(g => g.toLowerCase() === name.toLowerCase())) name = 'New group ' + n++;
  try { await api('clone', { action: 'group', group: name }); } catch (e) { tell(e.message); return; }
  shut.delete(name);
  await load(open);
  const hd = [...document.querySelectorAll('.ghead')].find(h => h.querySelector('.fold b').textContent === name);
  if (hd) renameGroup(hd, name);
});

function fillGroups(sel) {
  const keep = sel.value; sel.textContent = '';
  for (const g of [''].concat(groups)) { const o = document.createElement('option'); o.value = g; o.textContent = g || 'No group'; sel.append(o); }
  sel.value = groups.includes(keep) ? keep : '';
}

// ── A voice ─────────────────────────────────────────────────
function showNothing() { open = null; $('voice').hidden = true; $('make').hidden = true; $('ev').hidden = true; $('empty').hidden = false; list(); }
function showVoice(name) {
  const v = voices.find(x => x.name === name); if (!v) return showNothing();
  if (open !== name) say('status', '');
  open = name;
  $('empty').hidden = true; $('make').hidden = true; $('ev').hidden = true; $('voice').hidden = false;
  $('vName').value = v.name;
  $('vDesc').value = v.description || '';
  $('vDesc').placeholder = 'e.g. warm narrator for bedtime stories';
  fillGroups($('vGroup')); $('vGroup').value = v.group || '';
  const who = users()[v.name] || [];
  const facts = [
    ['Made from', v.designed_from ? 'a description: “' + v.designed_from + '”' : 'a recording' + (v.source ? ' (' + v.source + ')' : '')],
    ['Speaks with', engineLabel(v.engine) + (v.seconds ? ', from ' + Math.round(v.seconds) + ' s of speech' : '')],
    ['Used by', who.length ? andList(who) : 'nobody yet; pick it for a character in Characters'],
  ];
  const dl = $('vFacts'); dl.textContent = '';
  for (const [k, t] of facts) { const dt = document.createElement('dt'); dt.textContent = k; const dd = document.createElement('dd'); dd.textContent = t; dl.append(dt, dd); }
  list();
}
$('voice').addEventListener('submit', async e => {
  e.preventDefault();
  const v = voices.find(x => x.name === open); if (!v) return;
  const to = $('vName').value.trim(), desc = $('vDesc').value.trim(), group = $('vGroup').value;
  if (!validName(to)) { say('status', 'A voice name is 1-40 lowercase letters, digits, - or _', true); $('vName').focus(); return; }
  if (to !== v.name && voices.some(x => x.name === to)) { say('status', 'Another voice has that name', true); $('vName').focus(); return; }
  let now = v.name;
  try {
    if (to !== v.name) { await api('clone', { action: 'rename', name: v.name, new_name: to }); now = to; }
    if (desc !== (v.description || '')) await api('clone', { action: 'describe', name: now, description: desc });
    if (group !== (v.group || '')) await api('clone', { action: 'group', name: now, group });
    await load(now);
    say('status', now !== v.name ? 'Renamed; the characters using it follow' : 'Saved');
  } catch (err) { await load(now).catch(() => {}); say('status', err.message, true); }
});
$('vName').addEventListener('input', () => { const p = $('vName').selectionStart, t = tidyName($('vName').value); if (t !== $('vName').value) { $('vName').value = t; $('vName').setSelectionRange(p, p); } });
$('vHear').addEventListener('click', async () => {
  const text = $('vSample').value.trim();
  say('status', 'Playing ' + open + '…');
  try { await api('clone', text ? { action: 'preview', name: open, text } : { action: 'preview', name: open }); say('status', ''); }
  catch (e) { say('status', e.message, true); }
});
$('vDel').addEventListener('click', async () => {
  const who = users()[open] || [];
  const note = who.length ? ' ' + andList(who) + (who.length === 1 ? ' uses' : ' use') + ' it and will speak with the default voice instead.' : '';
  if (!(await askYes('Delete the voice ' + open + '? Its recording goes too.' + note))) return;
  try { await api('clone', { action: 'remove', name: open }); await load(null); } catch (e) { say('status', e.message, true); }
});

// ── A new voice ─────────────────────────────────────────────
function showMake() {
  open = '+new';
  $('empty').hidden = true; $('voice').hidden = true; $('ev').hidden = true; $('make').hidden = false;
  if (!segValue('mFrom')) seg('mFrom', design().ready ? 'design' : 'record');
  fromChanged(); list();
  $('mName').focus();
}
$('add').addEventListener('click', showMake);
$('mCancel').addEventListener('click', () => { if (!busy) showNothing(); });
$('mName').addEventListener('input', () => { const p = $('mName').selectionStart, t = tidyName($('mName').value); if (t !== $('mName').value) { $('mName').value = t; $('mName').setSelectionRange(p, p); } });
$('mFrom').addEventListener('click', e => { const b = e.target.closest('button'); if (!b || b.disabled || busy) return; seg('mFrom', b.dataset.v); fromChanged(true); });
$('mSecs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) seg('mSecs', b.dataset.v); });
seg('mSecs', '12');

// The engines a voice can speak with, installed ones first; one not installed cannot be picked.
function fillEngines() {
  const sel = $('mEngine'), keep = sel.value; sel.textContent = '';
  const list = engines();
  // Installed first; then the ones that could be installed here; last, those this PC's card does not run.
  const rank = e => e.ready ? 0 : e.runs === false ? 2 : 1;
  for (const e of [...list].sort((a, b) => rank(a) - rank(b))) {
    const o = document.createElement('option'); o.value = e.name; o.disabled = !e.ready;
    o.textContent = e.label + (e.ready ? '' : e.runs === false ? ' — needs ' + e.needs : ' — not installed');
    sel.append(o);
  }
  const ok = n => list.some(e => e.name === n && e.ready);
  sel.value = ok(keep) ? keep : (list.find(e => e.ready) || {}).name || '';
  engineHelp();
}
const langWord = c => { try { return new Intl.DisplayNames(['en'], { type: 'language' }).of(c) || c; } catch { return c; } };
function engineHelp() {
  const e = engines().find(x => x.name === $('mEngine').value);
  const mine = (state && state.languages) || [];
  const speaks = e && e.languages ? e.languages.filter(l => !mine.length || mine.includes(l)) : [];
  const missing = e && e.languages ? mine.filter(l => !e.languages.includes(l)) : [];
  $('mEngineHelp').textContent = !e ? 'Install a voice engine in Integrations' : (speaks.length ? 'Speaks ' + andList(speaks.map(langWord)) : 'None of your languages')
    + (missing.length ? '; not ' + andList(missing.map(langWord)) : '');
  $('mEngineTip').dataset.tip = e ? 'The engine the new voice speaks with.\n**' + e.label + ':** ' + e.note + '.'
    + (e.transcript ? '\n\nIt needs what the recording says; speech recognition writes it down.' : '')
    + (e.cpu ? '\n\nIt runs on the processor; engines are installed in Integrations.' : '\n\nEngines are installed in Integrations, GPU voices.') : 'The engines are installed in Integrations.';
}
$('mEngine').addEventListener('change', engineHelp);

// Description, Microphone or Sound file: which fields show, what the button does.
let lastFrom = '';
function fromChanged(byUser) {
  const d = design(), btn = $('mFrom').querySelector('[data-v=design]');
  btn.disabled = !d.ready;
  btn.title = d.ready ? '' : 'Designing from words ' + designWhy();
  if (!d.ready && segValue('mFrom') === 'design') seg('mFrom', 'record');
  const from = segValue('mFrom') || 'record';
  document.querySelectorAll('#make [data-for]').forEach(r => r.hidden = !r.dataset.for.split(' ').includes(from));
  $('mFromHelp').textContent = from === 'design' ? 'Made up from words; no recording, no one\'s voice'
    : from === 'record' ? 'Your own voice, from the microphone' : 'Someone\'s voice, from a recording'
    ;
  if (!d.ready) $('mFromHelp').textContent += ' · from a description ' + designWhy();
  const lab = $('mDescLab');
  lab.innerHTML = from === 'design'
    ? 'The voice in words<span class="tip" tabindex="0" data-tip="Age, gender, timbre, pace, mood and accent, in English.\nFor example: &quot;a woman in her forties, smooth low alto, calm and dry, neutral American accent&quot;.\n\nQwen3-TTS reads the sample once in that voice, and the engine below then speaks with it.\n\nIt also becomes the voice&#39;s description.">i</span>'
    : 'Description<span class="opt">optional</span><span class="help">What it is, or what it is for</span>';
  $('mDesc').placeholder = from === 'design' ? 'e.g. a woman in her forties, smooth low alto, calm and dry, neutral American accent' : 'e.g. my own voice, for announcements';
  // A designed voice speaks best with Qwen3-TTS, which made it: picked when switching to Description.
  if (from === 'design' && lastFrom !== 'design' && engines().some(e => e.name === 'qwen3' && e.ready)) { $('mEngine').value = 'qwen3'; engineHelp(); }
  lastFrom = from;
  goLabel();
  if (byUser) say('mstatus', '');
}
function goLabel() {
  const from = segValue('mFrom');
  $('mGo').textContent = from === 'design' ? 'Design' : from === 'record' ? (recording ? 'Stop' : 'Record') : 'Clone';
  $('mGo').disabled = (busy && !recording) || (from === 'file' && !pendingFile);
}

// The file: dropped on the box or chosen.
function takeFile(f) {
  if (!f) return;
  pendingFile = f;
  $('mDropText').innerHTML = '<b></b> · ' + Math.max(1, Math.round(f.size / 1024)) + ' KB';
  $('mDropText').querySelector('b').textContent = f.name;
  if (!$('mName').value) $('mName').value = tidyName(f.name.replace(/\.[^.]+$/, ''));
  goLabel();
}
$('mPick').addEventListener('click', () => $('mFile').click());
$('mFile').addEventListener('change', e => { takeFile(e.target.files[0]); e.target.value = ''; });
const drop = $('mDrop');
drop.addEventListener('dragover', e => { if (dragVoice || !e.dataTransfer.types.includes('Files')) return; e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => { drop.classList.remove('over'); if (!e.dataTransfer.files.length) return; e.preventDefault(); takeFile(e.dataTransfer.files[0]); });

// While a voice is made: the button spins, and the line under says what voice waits for.
let tick = 0, recording = false;
function working(on, text) {
  busy = on; $('mGo').classList.toggle('busy', on && !recording); goLabel();
  ['mCancel', 'add'].forEach(id => $(id).disabled = on);
  clearInterval(tick);
  if (!on) return;
  const t0 = Date.now();
  say('mstatus', text);
  tick = setInterval(async () => {
    if (recording) return;
    try {
      const st = await api('status');
      const l = st.loading;
      say('mstatus', l ? 'Starting ' + engineLabel(l.engine) + ' ' + engineWhere(l.engine) + '… ' + Math.max(0, Math.round((Date.now() - Date.parse(l.since)) / 1000)) + ' s'
        : text + ' ' + Math.round((Date.now() - t0) / 1000) + ' s');
    } catch (e) {}
  }, 1000);
}
$('make').addEventListener('submit', async e => {
  e.preventDefault();
  const from = segValue('mFrom');
  if (from === 'record' && recording) { api('clone', { action: 'stop' }).catch(() => {}); return; } // Stop: clone what was recorded
  if (busy) return;
  const name = $('mName').value.trim(), desc = $('mDesc').value.trim(), group = $('mGroup').value, engine = $('mEngine').value;
  const fail = (text, field) => { say('mstatus', text, true); if (field) $(field).focus(); };
  if (!validName(name)) return fail('Give the voice a name: lowercase letters, digits, - or _', 'mName');
  if (voices.some(v => v.name === name)) return fail('A voice called ' + name + ' exists; pick another name', 'mName');
  if (!engine) return fail('Install a voice engine in Integrations first');
  const a = { name, engine };
  if (group) a.group = group;
  if (desc) a.description = desc;
  if (from === 'design') {
    if (!design().ready) return fail('Designing a voice ' + designWhy());
    if (!desc) return fail('Describe the voice in words first', 'mDesc');
    if ($('mSample').value.trim()) a.text = $('mSample').value.trim();
    working(true, 'Designing ' + name + '…');
    try {
      const r = await api('clone', { ...a, action: 'design' });
      reset(); await load(name);
      say('status', 'Its sample is playing. Keep it, or Delete it and try other words.' + (r.warning ? ' ' + r.warning : ''));
    } catch (err) { say('mstatus', err.message, true); }
    finally { working(false); }
    return;
  }
  if (!$('mRights').checked) return fail('Confirm you may use this voice first', 'mRights');
  a.rights_confirmed = true;
  if (from === 'file') {
    if (!pendingFile) return fail('Drop a sound file or choose one first');
    working(true, 'Cloning ' + pendingFile.name + '…');
    try {
      const data = await new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1] || ''); r.onerror = no; r.readAsDataURL(pendingFile); });
      const ext = (pendingFile.name.match(/\.[a-z0-9]+$/i) || ['.wav'])[0];
      const r = await api('clone', { ...a, action: 'add', file: data, ext });
      reset(); await load(name);
      say('status', 'Made from the file.' + [].concat(r.quality || [], r.warning || []).map(x => ' ' + x).join(''));
    } catch (err) { say('mstatus', err.message, true); }
    finally { working(false); }
    return;
  }
  // The microphone: three ticks, then it records; the button stops it early.
  const secs = +(segValue('mSecs') || 12), lead = 2100, t0 = Date.now();
  recording = true; working(true, '');
  const rec = setInterval(() => {
    const ms = Date.now() - t0;
    say('mstatus', ms < lead ? 'Get ready… it records after the ticks' : ms < lead + secs * 1000 ? 'Recording ' + Math.floor((ms - lead) / 1000) + ' / ' + secs + ' s · read aloud in your normal voice' : 'Cloning your voice…');
  }, 200);
  try {
    const r = await api('clone', { ...a, action: 'record', seconds: secs });
    reset(); await load(name);
    say('status', 'Made from your recording.' + [].concat(r.quality || [], r.warning || []).map(x => ' ' + x).join(''));
  } catch (err) { say('mstatus', err.message, true); }
  finally { clearInterval(rec); recording = false; working(false); }
});
// After a voice is made, the form starts empty again; how it is made stays.
function reset() {
  ['mName', 'mDesc', 'mSample'].forEach(id => $(id).value = '');
  $('mRights').checked = false; pendingFile = null; $('mDropText').textContent = 'Drop a sound file here'; say('mstatus', '');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && open === '+new' && !busy && !document.querySelector('.vdlg, .vmenu')) showNothing(); });

load(null).catch(e => { $('empty').textContent = e.message; });
</script>

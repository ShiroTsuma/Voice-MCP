<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>voice · Integrations</title>
<!--
  The Integrations window, in the characters window's look. On the left the groups (agents, speaking,
  GPU voices, cloning, listening) with how much of each is set up; on the right the group's integrations,
  each with its state, what it gives, and its one or two actions. Long actions show their log in place.
  Every entry comes from a file in integrations\ (integrations/README.md).
-->
<link rel="stylesheet" href="/settings/common.css">
<style>
  :root {
    --ground:   oklch(21.5% 0.003 260);
    --sheet:    oklch(25% 0.003 260);
    --field:    oklch(29.5% 0.003 260);
    --field-hi: oklch(34% 0.003 260);
    --rule:     oklch(30% 0.003 260);
    --ink:      oklch(94% 0.002 260);
    --ink-2:    oklch(72% 0.003 260);
    --ink-3:    oklch(54% 0.003 260);
    --on:       oklch(76% 0.13 152);
    --part:     oklch(80% 0.12 92);
    --err:      oklch(74% 0.15 18);

    --ui: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    --ui-display: "Segoe UI Variable Display", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    --ui-small: "Segoe UI Variable Small", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    --mono: "Cascadia Mono", Consolas, monospace;
  }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* ── Groups ───────────────────────────────────────────────── */
  aside { width: 260px; flex: none; display: flex; flex-direction: column; border-right: 1px solid var(--rule); }
  aside header { padding: 18px 20px 10px; }
  aside header p { margin: 0; font: 12.5px/1.4 var(--ui-small); color: var(--ink-2); }
  nav { flex: 1; overflow-y: auto; padding: 6px 8px; }
  nav button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 9px 12px; border-radius: 6px; }
  nav button:hover { background: color-mix(in oklab, var(--ink) 5%, transparent); }
  nav button.sel { background: var(--field); }
  nav b { display: block; font: 600 14px/1.3 var(--ui); }
  nav small { display: block; font: 12px/1.35 var(--ui-small); color: var(--ink-2); }
  aside footer { padding: 12px 20px 14px; border-top: 1px solid var(--rule); font: 12px/1.45 var(--ui-small); color: var(--ink-3); }

  /* ── A group's integrations ───────────────────────────────── */
  main { display: block; flex: 1; min-width: 0; overflow-y: auto; padding: 22px 32px 32px; scrollbar-width: thin; scrollbar-color: var(--field-hi) transparent; }
  main h2 { margin: 0 0 2px; font: 600 18px/1.3 var(--ui-display); }
  main > p { margin: 0 0 16px; font: 13px/1.4 var(--ui-small); color: var(--ink-2); }
  .it { display: grid; grid-template-columns: 1fr auto; column-gap: 18px; padding: 14px 0; border-top: 1px solid var(--rule); }
  .it:first-of-type { border-top: 0; }
  .it h3 { margin: 0; display: flex; align-items: baseline; gap: 10px; font: 600 14.5px/1.35 var(--ui); }
  .state { font: 12px var(--ui-small); color: var(--ink-3); display: inline-flex; align-items: center; gap: 6px; }
  .state::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
  .state.on { color: var(--on); } .state.on::before { background: var(--on); }
  .state.partly { color: var(--part); } .state.partly::before { background: var(--part); }
  .state.error { color: var(--err); } .state.error::before { background: var(--err); }
  .state.off::before { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink-3); }
  .state.missing::before { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink-3); }
  .state.planned::before { background: transparent; border: 1.5px dashed var(--ink-3); box-sizing: border-box; }
  .it.planned h3 > span:first-child, .it.planned .about { color: var(--ink-2); }  /* not in voice yet */
  .about { margin: 3px 0 0; font: 13px/1.45 var(--ui-small); color: var(--ink-2); }
  .expr { margin: 3px 0 0; font: 12px/1.6 var(--ui-small); color: var(--ink-3, var(--ink-2)); }
  .expr .tok { font: 11.5px/1 ui-monospace, Consolas, monospace; color: var(--ink); background: var(--field); border-radius: 4px; padding: 1px 5px; }
  .detail { margin: 3px 0 0; font: 12.5px/1.45 var(--ui-small); color: var(--ink-3); user-select: text; }
  .detail a { color: var(--ink-2); }
  .acts { display: flex; gap: 8px; align-items: flex-start; }
  .btn { height: 30px; padding: 0 12px; border: 0; border-radius: 6px; background: var(--field); font: 600 13px var(--ui); white-space: nowrap; }
  .btn:hover { background: var(--field-hi); }
  .btn.primary { background: var(--ink); color: var(--ground); }
  /* As common.css, again after this window's .btn.primary, so a disabled main button looks disabled. */
  .btn:disabled { background: transparent; color: var(--ink-3); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--ink) 14%, transparent); cursor: default; }
  .log { grid-column: 1 / -1; margin-top: 10px; }
  .log summary { font: 12.5px var(--ui-small); color: var(--ink-2); cursor: pointer; }
  .log pre { margin: 6px 0 0; max-height: 180px; overflow: auto; padding: 8px 10px; border-radius: 6px; background: var(--sheet);
    font: 12px/1.45 var(--mono); color: var(--ink-2); white-space: pre-wrap; user-select: text; }
  .log .fail { color: var(--err); }
  /* Not common.css's centred empty state: a quiet line under the group's heading. */
  .empty { margin: 30px 0 0; padding: 0; font: inherit; text-align: start; color: var(--ink-2); }
  /* An [i] with something to check inside: an update, a step left, none of the user's languages. */
  .tip.warn { color: var(--part); box-shadow: inset 0 0 0 1.2px var(--part); }
  /* A setting of the integration, such as a model size. */
  .pick { margin: 8px 0 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font: 12.5px var(--ui-small); color: var(--ink-2); }
  .seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: 7px; background: var(--field); }
  .seg button { height: 24px; padding: 0 10px; border: 0; border-radius: 5px; background: none; font: 600 12.5px var(--ui); color: var(--ink-2); }
  .pick .note { flex-basis: 100%; color: var(--ink-3); }
  .field input { flex: 1; min-width: 180px; max-width: 340px; height: 28px; padding: 0 9px; border: 0; border-radius: 6px; background: var(--field);
    font: 12.5px var(--mono); color: var(--ink); user-select: text; }
  .field input:hover { background: var(--field-hi); }
  .field .btn { height: 28px; }
  /* One button per integration: its main action, and on the arrow the others. */
  .split { display: inline-flex; }
  .split .btn.main { border-radius: 6px 0 0 6px; }
  .split .btn.main:only-child { border-radius: 6px; }
  .split .btn.more { width: 28px; padding: 0; border-radius: 0 6px 6px 0; margin-left: 1px; position: relative; }
  .split .btn.more::after { content: ""; position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -5px 0 0 -3px;
    border: solid currentColor; border-width: 0 1.6px 1.6px 0; transform: rotate(45deg); }
  .split.primary .btn { background: var(--ink); color: var(--ground); }
  .split.primary .btn:hover { background: color-mix(in oklab, var(--ink) 86%, var(--ground)); }
  .split .btn:disabled { cursor: not-allowed; }
  .split.primary .btn.more { box-shadow: inset 1px 0 0 color-mix(in oklab, var(--ground) 35%, transparent); margin-left: 0; }
  .actmenu .vopt { padding-left: 12px; }
  .actmenu .vopt.info { border-top: 1px solid var(--rule); border-radius: 0 0 5px 5px; margin-top: 3px; }
  .actmenu .vopt.info:first-child { border-top: 0; margin-top: 0; }
  /* Info and settings: one integration in full. */
  .infobox { max-width: min(560px, calc(100vw - 32px)); width: 560px; max-height: calc(100vh - 48px); overflow-y: auto; user-select: text; }
  .infobox h3 { margin: 0 0 6px; display: flex; align-items: baseline; gap: 10px; font: 600 16px/1.3 var(--ui-display); }
  .infobox .about { margin: 0 0 12px; }
  .irow { display: grid; grid-template-columns: 110px 1fr; gap: 12px; padding: 7px 0; border-top: 1px solid var(--rule); font: 13px/1.45 var(--ui-small); }
  .ilab { color: var(--ink-3); }
  .ival { color: var(--ink-2); min-width: 0; }
  .ival a { color: var(--ink-2); word-break: break-all; }
  .ival .pick { margin: 0; }
  .toks { display: flex; flex-wrap: wrap; gap: 4px; }
  .toks .tok { font: 11.5px/1.5 ui-monospace, Consolas, monospace; color: var(--ink); background: var(--field); border-radius: 4px; padding: 1px 6px; }
  .infobox .vdlg-row { margin-top: 12px; }
  .actmenu .vopt.danger { color: var(--err); }
</style>
</head>
<body>
<aside>
  <header>
    <h1>Integrations</h1>
    <p>What voice is wired into, and the models and backends it can use.</p>
  </header>
  <nav id="groups" aria-label="Groups"></nav>
  <footer>Each entry is a file in voice's <b>integrations</b> folder. Drop a .toml file in the data folder's integrations folder to add your own.</footer>
</aside>
<main id="main" aria-live="polite"></main>

<script src="/settings/common.js"></script>
<script>
const $ = id => document.getElementById(id);
// The log's open state: what the user chose wins; untouched, it is open while the action runs.
let data = { groups: [], items: [] }, group = 'agents', timer = 0, logOpen = new Map();

// An integration shows in its group and in the ones it names in also (a GPU
// voice that clones is under Cloning too).
const inGroup = (i, g) => i.group === g || (i.also || []).includes(g);

// Language names from the browser, and what speaks the user's languages.
// Overrides common.js's langName, which also names "auto".
langName = code => { try { return new Intl.DisplayNames(['en'], { type: 'language' }).of(code) || code; } catch { return code; } };
const andList = a => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];
const emotionText = { none: 'None', intensity: 'As intensity', labels: 'As labels', instruct: 'Any mood, by instruction' };
function languagesLine(it) {
  const langs = it.languages || [], mine = data.languages || [];
  if (!langs.length) return '';
  if (langs.includes('*')) return mine.length ? 'Speaks your languages' : 'Nearly every language';
  if (!mine.length) return langs.length > 4 ? langs.length + ' languages' : andList(langs.map(langName));
  const yes = mine.filter(l => langs.includes(l)), no = mine.filter(l => !langs.includes(l));
  if (!yes.length) return 'None of your languages (' + andList(no.map(langName)) + ')';
  return (no.length ? 'Your ' + andList(yes.map(langName)) + '; not ' + andList(no.map(langName)) : 'Your ' + andList(yes.map(langName))) + (langs.length > yes.length ? ' (' + langs.length + ' languages in all)' : '');
}

function count(g) {
  // Engines still to come are listed, not counted as something to set up.
  const all = data.items.filter(i => inGroup(i, g.id)), items = all.filter(i => i.status.state !== 'planned');
  const on = items.filter(i => i.status.state === 'on').length;
  const later = all.length - items.length;
  return (items.length ? on + ' of ' + items.length + ' set up' : 'Nothing here yet') + (later ? ', ' + later + ' coming later' : '');
}

function renderGroups() {
  const nav = $('groups'); nav.textContent = '';
  for (const g of data.groups) {
    if (!data.items.some(i => inGroup(i, g.id))) continue;
    const b = document.createElement('button'); b.type = 'button';
    b.className = g.id === group ? 'sel' : '';
    b.innerHTML = '<b></b><small></small>';
    b.querySelector('b').textContent = g.title;
    b.querySelector('small').textContent = count(g);
    b.onclick = () => { group = g.id; render(); };
    nav.append(b);
  }
}

const stateText = { on: 'Set up', off: 'Off', missing: 'Not installed', partly: 'Needs a step', error: 'Problem', planned: 'Coming later' };

// The [i] beside a card's title: its details (what it is good at) as the
// first paragraph, then the facts as a list with bold labels, then what keeps
// it from this PC. Info and settings has the same and more: the state, the
// settings, every language and sound by name, and the link.
const sizeText = s => /\d[BM]$/.test(s) ? s + ' parameters' : s;
// "an NVIDIA graphics card" -> "NVIDIA graphics card", as Info and settings shows it.
const capFirst = s => s.replace(/^./, c => c.toUpperCase());
function soundsFacts(x) {
  const sounds = x.sounds || [], moods = (x.moods || []).filter(m => m !== 'any');
  const noMood = x.emotion === 'none' || !x.emotion;
  if (!sounds.length && noMood) return ['- **Sounds and moods:** none, plain speech (sound tags and moods are left out)'];
  const tags = sounds.slice(0, 4).map(n => '{' + n + '}');
  const s = !sounds.length ? 'none' : sounds.length > 4 ? tags.join(', ') + ' and ' + (sounds.length - 4) + ' more' : andList(tags);
  const m = noMood ? 'none' : x.emotion === 'instruct' ? 'any, by instruction'
    : (moods.length ? moods.length : 'some') + (x.emotion === 'intensity' ? ', set as intensity' : x.emotion === 'labels' ? ', as labels' : '');
  return ['- **Sounds:** ' + s, '- **Moods:** ' + m];
}
// attention is what a card's [i] holds for the user to check, and turns the
// [i] yellow: a step left or an update, or no language of theirs.
function attention(it) {
  const out = [];
  if (it.status.detail && (it.status.state === 'partly' || it.status.label)) out.push('**' + (it.status.label || 'Needs a step') + ':** ' + it.status.detail + '.');
  const langs = it.languages || [], mine = data.languages || [];
  if (mine.length && langs.length && !langs.includes('*') && !mine.some(m => langs.includes(m))) {
    out.push('**Not your languages:** it speaks none of ' + andList(mine.map(langName)) + '.');
  }
  return out;
}

function tipText(it) {
  const facts = [], caveats = attention(it);
  if (it.runs_on) facts.push('- **Runs on:** ' + capFirst(it.runs_on.replace(/^an? /, '')));
  if (it.vram) facts.push('- **Graphics memory:** about ' + it.vram + ' GB while loaded');
  if (it.size) facts.push('- **Size:** ' + sizeText(it.size));
  const langs = it.languages || [];
  if (langs.includes('*')) facts.push('- **Languages:** nearly every language');
  else if (langs.length > 12) facts.push('- **Languages:** ' + langs.length + ', Info and settings lists them');
  else if (langs.length) facts.push('- **Languages:** ' + andList(langs.map(langName)));
  if (it.expressive) facts.push(...soundsFacts(it.expressive));
  if (it.license) facts.push('- **License:** ' + it.license);
  if (it.status.state === 'planned') caveats.push('**Coming later:** not in voice yet, so there is nothing to install.');
  // An install this PC's graphics card cannot run says why ("Needs an NVIDIA graphics card").
  const blocked = (it.status.actions || []).find(a => a.disabled && a.why && /^Needs /.test(a.why));
  if (blocked) caveats.push('**Not on this PC:** it ' + blocked.why.replace(/^N/, 'n') + ', so it cannot be installed here.');
  return [it.details, facts.join('\n'), caveats.join('\n\n')].filter(Boolean).join('\n\n');
}

function renderMain() {
  const main = $('main'), g = data.groups.find(x => x.id === group);
  const keepScroll = main.scrollTop;
  main.textContent = '';
  if (!g) return;
  const h = document.createElement('h2'); h.textContent = g.title;
  const p = document.createElement('p'); p.textContent = g.about;
  main.append(h, p);
  // The group's own first, then those from other groups that show here too.
  // Engines still to come last of all.
  const later = i => i.status.state === 'planned' ? 2 : 0;
  const items = data.items.filter(i => inGroup(i, group)).sort((a, b) => (later(a) + (a.group === group ? 0 : 1)) - (later(b) + (b.group === group ? 0 : 1)));
  if (!items.length) { const e = document.createElement('p'); e.className = 'empty'; e.textContent = 'Nothing in this group.'; main.append(e); }
  for (const it of items) {
    const row = document.createElement('div'); row.className = 'it' + (it.status.state === 'planned' ? ' planned' : '');
    const left = document.createElement('div');
    const h3 = document.createElement('h3');
    const name = document.createElement('span'); name.textContent = it.title;
    // One short line under the title; the rest behind the [i] beside it.
    const why = tipText(it);
    if (why) { const t = document.createElement('span'); t.className = 'tip' + (attention(it).length ? ' warn' : ''); t.tabIndex = 0; t.textContent = 'i'; t.dataset.tip = why; t.dataset.for = it.id; name.append(t); }
    const st = document.createElement('span'); st.className = 'state ' + it.status.state;
    const running = it.job && !it.job.done;
    st.textContent = running ? 'Working…' : it.status.label || stateText[it.status.state] || it.status.state;
    h3.append(name, st);
    left.append(h3);
    if (it.about) { const a = document.createElement('p'); a.className = 'about'; a.textContent = it.about; left.append(a); }
    // The rest is behind the [i], yellow when something there needs a look
    // (a step left, an update, none of the user's languages); only an error
    // shows on the row.
    if (it.status.detail && it.status.state === 'error') {
      const d = document.createElement('p'); d.className = 'detail'; d.textContent = it.status.detail;
      left.append(d);
    }
    row.append(left, actionButton(it));
    if (it.job && (it.job.log.length || it.job.error)) {
      const det = document.createElement('details'); det.className = 'log';
      det.open = logOpen.has(it.id) ? logOpen.get(it.id) : running;
      det.addEventListener('toggle', () => { if (det.isConnected) logOpen.set(it.id, det.open); });
      const sum = document.createElement('summary');
      sum.textContent = running ? 'Working on it…' : it.job.error ? 'Failed: ' + it.job.error : 'Done';
      const pre = document.createElement('pre');
      pre.textContent = it.job.log.join('\n');
      if (it.job.error) { const f = document.createElement('span'); f.className = 'fail'; f.textContent = (it.job.log.length ? '\n' : '') + it.job.error; pre.append(f); }
      det.append(sum, pre);
      row.append(det);
      requestAnimationFrame(() => { pre.scrollTop = pre.scrollHeight; });
    }
    main.append(row);
  }
  main.scrollTop = keepScroll;
}

// picker shows an integration's choice (a model size); picking one applies it
// from the next use.
function picker(it) {
  const c = it.status.choice;
  const wrap = document.createElement('div'); wrap.className = 'pick';
  const lab = document.createElement('span'); lab.textContent = c.label;
  const seg = document.createElement('div'); seg.className = 'seg'; seg.setAttribute('role', 'group'); seg.setAttribute('aria-label', c.label);
  const note = document.createElement('span'); note.className = 'note';
  for (const o of c.options) {
    const b = document.createElement('button'); b.type = 'button';
    b.textContent = o.label; b.title = o.note || '';
    const on = o.value === c.value;
    b.className = on ? 'on' : ''; b.setAttribute('aria-pressed', on ? 'true' : 'false');
    if (on) note.textContent = o.note || '';
    b.onclick = async () => {
      if (on) return;
      try { await api('integration', { id: it.id, action: 'choose:' + o.value }); } catch (e) { tell(e.message); }
      refresh();
    };
    seg.append(b);
  }
  wrap.append(lab, seg, note);
  return wrap;
}

// actionButton is an integration's actions as one button: the main one (the
// primary, else the first: Install, Start server, Load now, Turn on) and, on
// its arrow, the others in a menu, so the row's text keeps its width.
// A removal: the integration's own, or one of its voices' (remove:<model>).
const isRemove = a => a.id === 'remove' || a.id.startsWith('remove:');
async function runAction(it, a, b) {
  const what = a.id === 'remove' ? it.title : a.label.replace(/^Remove /, '') + ' from ' + it.title;
  if (isRemove(a) && !(await askYes('Remove ' + what + '? Its files are deleted; you can download or install it again later.', 'Remove'))) return;
  if (b) b.disabled = true;
  try { await api('integration', { id: it.id, action: a.id }); logOpen.delete(it.id); } catch (e) { tell(e.message); }
  refresh();
}
let actMenu = null;
function closeActMenu() { if (actMenu) { actMenu.remove(); actMenu = null; } }
function actionButton(it) {
  const acts = it.status.actions || [];
  const wrap = document.createElement('div'); wrap.className = 'acts';
  const info = { id: 'info', label: 'Info and settings' };
  // Without an action of its own, the button is its info.
  // Remove is never the main button: one click too close to Load now.
  const main = acts.find(a => a.primary) || acts.find(a => !isRemove(a)) || info;
  const rest = acts.filter(a => a !== main);
  if (main !== info) rest.push(info);
  const split = document.createElement('div'); split.className = 'split' + (main.primary ? ' primary' : '');
  const b = document.createElement('button'); b.type = 'button'; b.className = 'btn main'; b.textContent = main === info ? 'Info' : main.label;
  b.onclick = () => main === info ? openInfo(it.id) : runAction(it, main, b);
  if (main.disabled) { b.disabled = true; b.title = main.why || ''; }
  split.append(b);
  if (rest.length) {
    const more = document.createElement('button'); more.type = 'button'; more.className = 'btn more';
    more.setAttribute('aria-label', 'More actions for ' + it.title); more.setAttribute('aria-haspopup', 'menu');
    let timer = null;
    const open = () => {
      clearTimeout(timer);
      if (actMenu && actMenu.owner === more) return;
      closeActMenu();
      const m = document.createElement('div'); m.className = 'vmenu actmenu'; m.setAttribute('role', 'menu'); m.owner = more;
      for (const a of rest) {
        const o = document.createElement('div'); o.className = 'vopt' + (isRemove(a) ? ' danger' : ''); o.setAttribute('role', 'menuitem'); o.tabIndex = 0;
        o.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); o.click(); } };
        o.textContent = a.label;
        o.onmouseenter = () => o.classList.add('hl'); o.onmouseleave = () => o.classList.remove('hl');
        if (a.id === 'info') o.classList.add('info');
        if (a.disabled) { o.setAttribute('aria-disabled', 'true'); o.title = a.why || ''; }
        o.onclick = () => { if (a.disabled) return; closeActMenu(); a.id === 'info' ? openInfo(it.id) : runAction(it, a, null); };
        m.append(o);
      }
      m.onmouseenter = () => clearTimeout(timer);
      m.onmouseleave = () => { timer = setTimeout(closeActMenu, 250); };
      document.body.append(m);
      const r = split.getBoundingClientRect();
      m.style.minWidth = r.width + 'px';
      m.style.left = Math.max(4, r.right - m.offsetWidth) + 'px';
      const below = innerHeight - r.bottom - 8;
      if (below >= m.offsetHeight) m.style.top = (r.bottom + 4) + 'px'; else m.style.bottom = (innerHeight - r.top + 4) + 'px';
      actMenu = m;
    };
    // Hovering opens it already, so a click only makes sure it is open.
    more.onclick = open;
    more.onmouseenter = open;
    more.onmouseleave = () => { timer = setTimeout(closeActMenu, 250); };
    split.append(more);
  }
  wrap.append(split);
  return wrap;
}
document.addEventListener('mousedown', e => { if (actMenu && !actMenu.contains(e.target) && !actMenu.owner.contains(e.target)) closeActMenu(); }, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && actMenu) { closeActMenu(); e.stopPropagation(); } }, true);
document.addEventListener('scroll', closeActMenu, true);

// openInfo shows one integration in full: what it is, the languages it
// speaks, the sounds and moods it makes, its size and its settings (a model
// size, a server's address). It stays open across the window's refreshes and
// shows the new state.
let infoId = null;
function openInfo(id) {
  infoId = id;
  let dlg = $('info');
  if (!dlg) {
    dlg = document.createElement('div'); dlg.id = 'info'; dlg.className = 'vdlg';
    dlg.addEventListener('mousedown', e => { if (e.target === dlg) closeInfo(); });
    document.body.append(dlg);
  }
  renderInfo();
}
function closeInfo() { infoId = null; const d = $('info'); if (d) d.remove(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && infoId && !actMenu) { closeInfo(); e.stopPropagation(); } }, true);
function renderInfo() {
  const dlg = $('info'), it = data.items.find(i => i.id === infoId);
  if (!dlg || !it) return closeInfo();
  const box = document.createElement('div'); box.className = 'vdlg-box infobox'; box.setAttribute('role', 'dialog'); box.setAttribute('aria-label', it.title);
  const h = document.createElement('h3');
  const st = document.createElement('span'); st.className = 'state ' + it.status.state; st.textContent = it.status.label || stateText[it.status.state] || it.status.state;
  h.append(it.title, st);
  box.append(h);
  const row = (label, content) => {
    if (!content) return;
    const r = document.createElement('div'); r.className = 'irow';
    const l = document.createElement('span'); l.className = 'ilab'; l.textContent = label;
    const v = document.createElement('div'); v.className = 'ival'; v.append(content);
    r.append(l, v); box.append(r);
  };
  const text = s => { const p = document.createElement('span'); p.textContent = s; return p; };
  // The dialog is the whole sheet: the card's line and its [i]'s explanation, then the facts in rows.
  for (const s of [it.about, it.details]) if (s) { const p = document.createElement('p'); p.className = 'about'; p.textContent = s; box.append(p); }
  row('State', it.status.detail ? text(it.status.detail) : null);
  const langs = it.languages || [];
  if (langs.length) row('Languages', text(langs.includes('*') ? 'Nearly every language' : languagesLine(it) + (langs.length <= 30 ? ' — ' + langs.map(langName).join(', ') : '')));
  if (it.expressive) {
    const x = it.expressive, sounds = x.sounds || [];
    if (sounds.length) {
      const s = document.createElement('div'); s.className = 'toks';
      sounds.forEach(n => { const t = document.createElement('code'); t.className = 'tok'; t.textContent = '{' + n + '}'; s.append(t); });
      row('Sounds', s);
    } else row('Sounds', text('None: sound tags are left out'));
    const moods = (x.moods || []).filter(m => m !== 'any');
    row('Moods', text((emotionText[x.emotion] || x.emotion) + (moods.length ? ': ' + moods.join(', ') : '')));
  }
  row('Runs on', it.runs_on ? text(it.runs_on.replace(/^an? /, '').replace(/^./, c => c.toUpperCase())) : null);
  row('Graphics memory', it.vram ? text('About ' + it.vram + ' GB while loaded') : null);
  row('Size', it.size ? text(sizeText(it.size)) : null);
  row('License', it.license ? text(it.license) : null);
  // The row names the setting, so the controls go without their own label.
  const bare = el => { el.firstChild.remove(); return el; };
  if (it.status.choice) row(it.status.choice.label, bare(picker(it)));
  if (it.status.field) row(it.status.field.label, bare(fieldRow(it)));
  if (it.link) { const a = document.createElement('a'); a.href = it.link; a.target = '_blank'; a.textContent = it.link.replace(/^https?:\/\//, ''); row('More', a); }
  const foot = document.createElement('div'); foot.className = 'vdlg-row';
  const close = document.createElement('button'); close.type = 'button'; close.className = 'vdlg-btn'; close.textContent = 'Close'; close.onclick = closeInfo;
  foot.append(close); box.append(foot);
  dlg.textContent = ''; dlg.append(box);
}

// fieldRow shows an integration's text setting (a server's address), saved
// with Save or Enter; what is being typed survives the window's refresh.
const drafts = new Map();
function fieldRow(it) {
  const f = it.status.field;
  const wrap = document.createElement('div'); wrap.className = 'pick field';
  const lab = document.createElement('span'); lab.textContent = f.label;
  const inp = document.createElement('input'); inp.type = 'text'; inp.spellcheck = false;
  inp.placeholder = f.placeholder || ''; inp.setAttribute('aria-label', f.label);
  inp.value = drafts.has(it.id) ? drafts.get(it.id) : f.value;
  const save = document.createElement('button'); save.type = 'button'; save.className = 'btn'; save.textContent = 'Save';
  const sync = () => { save.disabled = inp.value.trim() === f.value; };
  inp.oninput = () => { drafts.set(it.id, inp.value); sync(); };
  const commit = async () => {
    save.disabled = true;
    try { await api('integration', { id: it.id, action: 'set:' + inp.value.trim() }); drafts.delete(it.id); } catch (e) { tell(e.message); sync(); return; }
    refresh();
  };
  save.onclick = commit;
  inp.onkeydown = e => { if (e.key === 'Enter' && !save.disabled) commit(); };
  sync();
  wrap.append(lab, inp, save);
  return wrap;
}

function render() { renderGroups(); renderMain(); }

async function refresh() {
  clearTimeout(timer);
  // Not while an address is being typed: the redraw would take the cursor away.
  const typing = document.activeElement && document.activeElement.closest && document.activeElement.closest('.field');
  try {
    data = await api('integrations');
    // Nor while an [i] is open: the redraw would take its box away.
    if (!typing && !actMenu && tipbox.hidden) { render(); if (infoId) renderInfo(); }
  } catch (e) { $('main').textContent = e.message; }
  const busy = data.items.some(i => i.job && !i.job.done);
  if (document.visibilityState === 'visible') timer = setTimeout(refresh, busy ? 1000 : 5000);
}
function onShow() { refresh(); }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && window.chrome && window.chrome.webview) window.chrome.webview.postMessage('close'); });
refresh();
</script>

id = "higgs"
group = "gpu"
order = 50
title = "Higgs Audio v3"
about = "Expressive speech and cloning in 100+ languages, on a speech server you set up."
details = "Expressive speech with emotions and sounds, and cloning, in more than 100 languages. voice does not install it: it talks to a speech server you set up, on this PC through WSL or Docker, on another machine or on a GPU server; Setup guide has the steps."
license = "Research and non-commercial use only"
runs_on = "a speech server with 12-16 GB of graphics memory, on this PC or another machine"
size = "about 10 GB of weights; 12-16 GB of graphics memory"
link = "https://huggingface.co/bosonai/higgs-audio-v3-tts-4b"
guide = "https://github.com/ShiroTsuma/Voice-MCP/blob/main/docs/higgs-audio.md"
also = ["cloning"]
languages = ["*"]
uses = "speech-server"
engine = "higgs"
# Start server / Stop server: the WSL setup of docs/higgs-audio.md. For another
# setup, copy this file to the integrations folder in voice's data folder and
# change these (a file there with the same id replaces this one).
start = ["wsl.exe", "-d", "Ubuntu", "--", "bash", "-lc", "~/higgs/serve.sh > ~/higgs/server.log 2>&1"]
stop = ["wsl.exe", "-d", "Ubuntu", "--exec", "pkill", "-f", "omni serve --model"]

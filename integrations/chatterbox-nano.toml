details = "Chatterbox Turbo made small (110M) for PCs without a graphics card: English with laughs, sighs and coughs, and cloning from a clip over 5 seconds without its transcript. It runs on the processor even where there is a graphics card, so it leaves the card to the GPU voices: about 1.5 times faster than speech on a 20-core desktop processor, slower on a smaller one (its makers quote 3 times on 8 cores). Its makers retired Chatterbox in August 2026. Every sentence carries Resemble's inaudible watermark."

title = "VoxCPM2"
about = "Cloning in 30 languages at 48 kHz."
details = "Clones from a short clip. With the clip's transcript it stays closer to the recording; without it, it speaks more freely and naturally. 30 languages, at 48 kHz. About 3 times faster than real time on an RTX 5080. No moods: asked for one, it drifts away from the voice. The first start compiles the model for a few minutes; later starts take about half a minute."
